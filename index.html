<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1118"><meta name="description" content="مطبّك - تحذير السائق من المطبات قبل الوصول إليها"><title>مطبّك 🚗⚠️</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><div class="brand"><b>⚠️ مطبّك</b><small>مساعد القيادة الذكي</small></div><button id="locate">⌖</button></header><div id="map"></div><div class="tools"><button id="voice">🔊</button><button id="mypos">◎</button></div><div id="warning" class="warning hidden"><b>⚠️ مطب أمامك</b><strong id="distance">—</strong><span id="warningText">خفف السرعة واستعد للمطب</span></div><div class="speed hidden" id="speedBox">سرعتك <b id="speed">0</b> كم/س</div><main><div class="handle"></div><div class="row"><div><h2 id="modeTitle">الخريطة الرئيسية</h2><small id="count">0 مطب مسجل</small></div><button id="add" class="primary">＋ إضافة مطب</button></div><section id="start"><div><b>ابدأ وضع القيادة</b><p>سنستخدم GPS لمراقبة الطريق وإصدار تحذير صوتي قبل المطبات.</p></div><button id="startDrive">ابدأ</button></section><section id="drive" class="hidden"><button id="stopDrive">إيقاف القيادة</button><button id="muteDrive">🔊 الصوت يعمل</button></section><div class="stats"><div><b id="trusted">0</b><small>موثوقة</small></div><div><b id="confirmed">0</b><small>تأكيدات</small></div><div><b id="gpsStatus">غير متصل</b><small>GPS</small></div></div></main><div id="modal" class="modal hidden"><div class="dialog"><button class="close" id="close">×</button><h2 id="modalTitle">تفاصيل المطب</h2><div id="modalBody"></div></div></div><div id="toast"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
